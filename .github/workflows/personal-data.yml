name: personal-data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The private terms file exists only on the owner's machine, so CI runs
      # the pattern and path rules. It catches commits made without the hook.
      - name: Scan tracked files for personal data
        run: python3 scripts/check_personal_data.py --all --no-private-terms
